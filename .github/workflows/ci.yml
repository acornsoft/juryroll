name: CI

# Manual only. GitHub Actions is blocked by a billing limit, so this
# workflow does not run on pull_request or push. Production deploys use
# scripts/deploy.sh (npm run deploy).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
      - name: Validate rules
        run: |
          python3 -m pip install -r shared/rules/requirements.txt
          python3 shared/rules/validate.py
      - run: npm ci
      - run: npm test
      - run: npm run build
